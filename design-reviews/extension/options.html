<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send to Design Reviews — settings</title>
<style>
  body { margin: 0; padding: 16px; width: 320px; font: 13px/1.4 Inter, system-ui, sans-serif; color: #0a0a0a; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 500; color: #404040; }
  input { font: inherit; font-size: 13px; border: 1px solid #e6e6e6; border-radius: 4px; padding: 7px 8px; }
  input:focus { outline: none; border-color: #E40072; }
  button { margin-top: 10px; font: inherit; font-size: 12px; font-weight: 500; padding: 7px 10px; border-radius: 2px; border: 1px solid #E40072; background: #E40072; color: #fff; cursor: pointer; }
  p { font-size: 12px; color: #737373; }
</style>
</head>
<body>
  <label>Design reviews URL
    <input type="url" id="url" placeholder="https://design-reviews.vercel.app">
  </label>
  <p>Use http://localhost:3000 while developing the app locally.</p>
  <button id="save" type="button">Save</button>
  <p id="msg"></p>
  <script src="options.js"></script>
</body>
</html>
